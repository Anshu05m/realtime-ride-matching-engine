name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ride_matching
          POSTGRES_PASSWORD: ride_matching
          POSTGRES_DB: ride_matching
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ride_matching"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://ride_matching:ride_matching@localhost:5432/ride_matching
      TEST_DATABASE_URL: postgresql+psycopg://ride_matching:ride_matching@localhost:5432/ride_matching_test
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # Same script docker compose runs on first Postgres start. Tests use this
      # database; the main `ride_matching` database is created by the service.
      - name: Create test database
        run: psql "postgresql://ride_matching:ride_matching@localhost:5432/ride_matching" -f scripts/init-test-db.sql

      # The tests build their schema with create_all(), so this is the only step
      # that exercises the Alembic migrations.
      - name: Apply migrations
        run: alembic upgrade head

      # tests/concurrency/test_simulation_contention.py needs a running app on
      # port 8000 and skips itself here. It is intentionally not part of CI.
      - name: Run tests
        run: pytest tests/ -v
